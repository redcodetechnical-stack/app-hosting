<style>
/* VOICE everyday wellness, calm and premium, like a shipped health app
   IDEA a pocket health instrument: rings, a gauge, pill controls, soft white cards
   PICTURE the live wellness gauge and activity rings, drawn from logged data
   COLOUR #F7F9FC ground, navy #102A43 ink and nav, #1E6091 blue, #55C6A9 mint accent
   TYPE Plus Jakarta Sans for figures and titles + Inter for text
   LAYOUT laptop: sidebar + card grid; phone: stacked cards + dark pill tab bar */
:root{color-scheme:light dark;
--bg:light-dark(#F7F9FC,#0A1522);--surf:light-dark(#FFFFFF,#12233A);--surf2:light-dark(#EEF2F7,#1A2F4A);
--ink:light-dark(#172B4D,#E7EEF7);--sub:light-dark(#5B6D83,#9DB0C6);--muted:light-dark(#8293A7,#7D92AA);
--line:light-dark(#E2E8F0,#223A57);--navy:#102A43;--pri:light-dark(#102A43,#E7EEF7);--onpri:light-dark(#FFFFFF,#0A1522);
--blue:light-dark(#1E6091,#5DA6DE);--mint:#55C6A9;--mintd:light-dark(#2E9C80,#6FD8BC);--orange:light-dark(#E8833A,#F2A25E);
--peri:light-dark(#5865D8,#8D97F0);--rose:light-dark(#D9546E,#EE8198);--water:light-dark(#2D8FD8,#62B3F0);
--shadow:0 1px 2px rgba(16,42,67,.05),0 8px 24px rgba(16,42,67,.06);--r:24px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(28px,4vw,36px);line-height:1.08;font-weight:800;text-wrap:balance}
h2{font-size:20px;font-weight:700;line-height:1.2}
h3{font-size:16px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
svg{display:block}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:var(--surf)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font:800 20px "Plus Jakarta Sans",sans-serif;letter-spacing:-.02em}
.logo{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(16,42,67,.12)}
.logo img{display:block}
.brand small{display:block;font:600 10px Inter,sans-serif;letter-spacing:.24em;color:#14B3B8;margin-top:1px}
.navg{margin:14px 0 4px;padding:0 12px;font-size:13px;color:var(--muted);font-weight:500}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;text-decoration:none;color:var(--sub);font-weight:500;font-size:15px}
.nav a:hover{background:var(--surf2);color:var(--ink)}
.nav a.on{background:var(--pri);color:var(--onpri)}
.nav a svg{width:20px;height:20px;flex:none}
main{padding:28px max(3vw,16px) 120px;max-width:1240px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top .lead{color:var(--sub);margin-top:6px}
.grid{display:grid;gap:16px;align-items:start;grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--surf);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.card.tint{background:var(--surf2);box-shadow:none;border-color:transparent}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch .s{color:var(--sub);font-size:14px}
.k{color:var(--sub);font-size:14px}
.big{font:800 clamp(30px,4vw,40px)/1 "Plus Jakarta Sans",sans-serif;letter-spacing:-.03em}
.big small{font-size:15px;font-weight:600;color:var(--sub);letter-spacing:0;margin-left:3px}
.mid{font:700 24px/1.1 "Plus Jakarta Sans",sans-serif;letter-spacing:-.02em}
.mid small{font-size:13px;color:var(--sub);font-weight:600;margin-left:2px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:grid;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--pri);color:var(--onpri);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--surf2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.mint{background:var(--mint);color:#08322A}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.icon{width:44px;padding:0}
.btn.danger{background:transparent;color:var(--rose);border:1px solid color-mix(in srgb,var(--rose) 40%,transparent)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surf2);color:var(--sub);white-space:nowrap}
.pill.m{background:color-mix(in srgb,var(--mint) 20%,transparent);color:var(--mintd)}
.pill.b{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.pill.o{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pill.r{background:color-mix(in srgb,var(--rose) 14%,transparent);color:var(--rose)}
label.f{display:grid;gap:6px;font-size:14px;color:var(--sub);font-weight:500}
input,select,textarea{font-size:16px;min-height:44px;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surf);width:100%}
textarea{min-height:96px;resize:vertical}
input[type=range]{padding:0;border:0;accent-color:var(--blue);min-height:32px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--mintd)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.seg{display:inline-flex;background:var(--surf2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--sub)}
.qlab{cursor:pointer}input:checked+.qlab{background:var(--pri);color:var(--onpri);border-color:transparent}input:focus-visible+.qlab{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(16,42,67,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surf);border-radius:999px;min-height:38px;padding:0 14px;font-size:14px;font-weight:500;color:var(--sub)}
.chip.on{background:var(--pri);color:var(--onpri);border-color:transparent}
.bar{height:10px;border-radius:99px;background:var(--surf2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--blue));transition:width .5s}
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1}
.li .t b{display:block;font-weight:600}
.li .t span{font-size:14px;color:var(--sub)}
.ib{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--blue)) 14%,transparent);color:var(--c,var(--blue))}
.ib svg{width:20px;height:20px}
.x{border:0;background:transparent;width:36px;height:36px;border-radius:12px;color:var(--muted);display:grid;place-items:center}
.x:hover{background:var(--surf2);color:var(--rose)}
.x svg{width:18px;height:18px}
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:26px 12px;color:var(--sub)}
.empty .ib{width:52px;height:52px;border-radius:18px}
.fig{position:relative;height:220px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font-family:Inter,sans-serif;fill:var(--sub);font-size:12px}
.note{font-size:13px;color:var(--sub)}
.src{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surf2);color:var(--sub)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:18px;margin-bottom:18px;background:color-mix(in srgb,var(--orange) 14%,var(--surf));border:1px solid color-mix(in srgb,var(--orange) 30%,transparent);font-size:14px}
.crisis{background:color-mix(in srgb,var(--rose) 10%,var(--surf));border:1px solid color-mix(in srgb,var(--rose) 28%,transparent);border-radius:18px;padding:14px 16px;font-size:14px}
.crisis b{color:var(--rose)}
.gauge{position:relative}
.gauge .val{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.comp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick button{border:0;background:var(--surf2);border-radius:18px;padding:14px 8px;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.quick button svg{width:22px;height:22px;color:var(--c)}
.quick button:hover{background:color-mix(in srgb,var(--c) 14%,var(--surf2))}
.seg7{display:grid;grid-template-columns:repeat(var(--n,10),minmax(0,1fr));gap:4px;height:34px;align-items:end}
.seg7 i{display:block;border-radius:5px;background:var(--surf2);height:100%}
.seg7 i.f{background:var(--c,var(--mint))}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal div{aspect-ratio:1;border-radius:10px;background:var(--surf2);display:grid;place-items:center;font-size:12px;color:var(--sub)}
.cal .h{background:transparent;aspect-ratio:auto;font-weight:600}
.hgrid{display:grid;grid-template-columns:repeat(28,minmax(0,1fr));gap:3px}
.hgrid i{aspect-ratio:1;border-radius:3px;background:var(--surf2)}
.hgrid i.f{background:var(--mint)}
.hgrid i.t{outline:2px solid var(--blue);outline-offset:1px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:transparent}
.chk.on{background:var(--mint);border-color:var(--mint);color:#08322A}
.chk svg{width:16px;height:16px}
.breath{display:grid;place-items:center;height:300px;position:relative}
.orb{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--mint) 70%,white),var(--mint) 45%,var(--blue));transform:scale(.55);transition:transform 4s ease-in-out;box-shadow:0 20px 60px color-mix(in srgb,var(--mint) 35%,transparent)}
.ring2{position:absolute;width:260px;height:260px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--blue) 40%,transparent)}
.blabel{position:absolute;text-align:center;color:#fff;font:700 20px "Plus Jakarta Sans",sans-serif;text-shadow:0 1px 8px rgba(16,42,67,.35)}
.blabel small{display:block;font-size:30px}
.chat{display:grid;gap:12px;max-height:56vh;overflow:auto;padding:4px}
.msg{max-width:84%;padding:12px 15px;border-radius:20px;white-space:pre-wrap;font-size:15px}
.msg.u{justify-self:end;background:var(--pri);color:var(--onpri);border-bottom-right-radius:6px}
.msg.a{justify-self:start;background:var(--surf2);border-bottom-left-radius:6px}
.glass{width:100%;height:230px}
.plan{display:grid;gap:12px;align-content:start}
.plan ul{margin:0;padding-left:18px;color:var(--sub);font-size:14px;display:grid;gap:4px}
.plan.hi{background:var(--navy);color:#fff}
.plan.hi .k,.plan.hi ul{color:#C9D6E5}
.tabbar{display:none}
.toastw{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(92vw,420px)}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;justify-content:space-between;gap:10px;align-items:center;animation:tin .25s ease-out}
.toast button{background:transparent;border:0;color:var(--mint);font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal{position:fixed;inset:0;background:rgba(10,21,34,.5);display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:var(--surf);border-radius:28px;padding:24px;width:min(560px,100%);max-height:92vh;overflow:auto;display:grid;gap:16px}
.sk{border-radius:var(--r);background:linear-gradient(90deg,var(--surf2),var(--surf),var(--surf2));background-size:200% 100%;animation:sk 1.2s infinite;height:180px}
@keyframes sk{to{background-position:-200% 0}}
.view{animation:vin .28s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.hide{display:none!important}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none}
.ex ol{margin:10px 0 0;padding-left:20px;color:var(--sub);font-size:14px;display:grid;gap:4px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--mint)}
.status.err i{background:var(--rose)}
@media(max-width:1100px){.c3{grid-column:span 6}.c4{grid-column:span 6}.c5,.c7{grid-column:span 12}.c8{grid-column:span 12}}
@media(max-width:860px){
.app{grid-template-columns:minmax(0,1fr)}
.side{display:none}
main{padding:18px 16px 120px}
.c3,.c4,.c6{grid-column:span 12}
.tabbar{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:40;background:#2A3442;border-radius:999px;padding:6px;gap:4px;box-shadow:0 12px 30px rgba(10,21,34,.3)}
.tabbar a{display:flex;align-items:center;gap:8px;height:48px;min-width:48px;justify-content:center;border-radius:999px;color:#C8D2DE;text-decoration:none;font-weight:600;font-size:14px;padding:0 13px}
.tabbar a.on{background:#fff;color:var(--navy)}
.tabbar a:not(.on) span{display:none}
.tabbar svg{width:21px;height:21px}
.mhead{display:flex!important}
}
@media(min-width:861px){.mhead{display:none!important}}
@media(max-width:520px){.quick{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:16px;border-radius:20px}.msg{max-width:92%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- selectors ---------- */
const P=()=>S.profile;
const waterOn=d=>sum(S.water.filter(w=>w.d===d).map(w=>w.ml));
const mealsOn=d=>S.meals.filter(m=>m.d===d);
const macroOn=d=>{const ms=mealsOn(d);return{k:sum(ms.map(m=>m.k*m.q)),p:sum(ms.map(m=>m.p*m.q)),c:sum(ms.map(m=>m.c*m.q)),f:sum(ms.map(m=>m.fa*m.q))}};
const woOn=d=>S.workouts.filter(w=>w.d===d);
const activeMin=d=>sum(woOn(d).map(w=>+w.min));
const stepsOn=d=>Math.max(+S.steps[d]||0,+(S.dsteps||{})[d]||0);
const burned=d=>sum(woOn(d).map(w=>w.k))+stepsOn(d)*0.04;
const hrs=(b,w)=>{const [bh,bm]=b.split(':').map(Number),[wh,wm]=w.split(':').map(Number);let m=(wh*60+wm)-(bh*60+bm);if(m<=0)m+=1440;return m/60};
const sleepOn=d=>S.sleep.find(s=>s.d===d);
const moodOn=d=>{const m=S.moods.filter(x=>x.d===d);return m.length?m[m.length-1]:null};
const activeHabits=d=>S.habits.filter(h=>!h.cr||h.cr<=d);
const habitPct=d=>{const hs=activeHabits(d);if(!hs.length)return null;return hs.filter(h=>(S.hdone[h.id]||[]).includes(d)).length/hs.length};
const medOn=d=>sum(S.med.filter(m=>m.d===d).map(m=>m.min));
const latestM=k=>{const a=S.metrics.filter(m=>m.k===k).sort((a,b)=>a.ts-b.ts);return a[a.length-1]};
function scoreParts(d){
  const p=P(),sl=sleepOn(d),md=moodOn(d),hp=habitPct(d),st=stepsOn(d),w=waterOn(d),am=activeMin(d);
  return[
   {k:'Sleep',c:'var(--peri)',v:sl?clamp(hrs(sl.bed,sl.wake)/p.sleep,0,1)*.7+sl.q/5*.3:null},
   {k:'Steps',c:'var(--blue)',v:st?clamp(st/p.steps,0,1):null},
   {k:'Water',c:'var(--water)',v:w?clamp(w/p.water,0,1):null},
   {k:'Movement',c:'var(--mint)',v:am?clamp(am/30,0,1):null},
   {k:'Mood',c:'var(--orange)',v:md?(md.m-1)/4*.6+(5-md.st)/4*.4:null},
   {k:'Habits',c:'var(--rose)',v:hp}];
}
const scoreOf=d=>{const ps=scoreParts(d).filter(x=>x.v!==null);return ps.length>=2?Math.round(avg(ps.map(x=>x.v))*100)/10:null};
function streak(fn){let n=0,d=today();if(!fn(d))d=addD(d,-1);while(fn(d)){n++;d=addD(d,-1)}return n}
function bmr(p){return 10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161)}
function suggestTargets(p){const af={sedentary:1.2,light:1.375,moderate:1.55,active:1.725}[p.activity]||1.4;let k=bmr(p)*af;if(p.goals.includes('Lose weight'))k-=400;if(p.goals.includes('Build muscle'))k+=250;return{kcal:Math.round(k/50)*50,water:Math.round(p.weight*35/50)*50,steps:p.activity==='sedentary'?6000:p.activity==='active'?10000:8000,sleep:8}}
const protT=()=>Math.round(P().weight*1.2);

let charts=[];const ros=[];
function barChart(id,items,o={}){charts.push(()=>{const el=document.getElementById(id);if(!el)return;const s=el.querySelector('svg');
 const draw=()=>{const W=el.clientWidth,H=el.clientHeight;if(!W)return;const L=6,R=6,T=24,B=24,n=items.length;const mx=Math.max(o.goal||0,...items.map(i=>i.v))*1.12||1;const cw=(W-L-R)/n,bw=Math.min(cw*.58,34);const y=v=>T+(H-T-B)*(1-v/mx);const small=W<520;
  let g='';if(o.goal){const gy=y(o.goal);g+=`<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" stroke="var(--muted)" stroke-dasharray="4 5"/><text x="${W-R}" y="${gy-6}" text-anchor="end">Goal ${o.fmt?o.fmt(o.goal):n0(o.goal)}</text>`}
  items.forEach((it,i)=>{const x=L+cw*i+(cw-bw)/2,yy=y(it.v),h=Math.max(it.v?3:0,H-B-yy);const last=i===n-1;
   g+=`<rect x="${x}" y="${H-B-h}" width="${bw}" height="${h}" rx="${Math.min(8,bw/2)}" fill="${last?(o.color||'var(--blue)'):`color-mix(in srgb,${o.color||'var(--blue)'} 38%,var(--surf2))`}"><title>${it.l}: ${o.fmt?o.fmt(it.v):n0(it.v)}</title></rect>`;
   const step=n>10?(small?7:5):(small&&n>7?2:1);
   if(i%step===0||last)g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${it.s||it.l}</text>`;
   if(it.v&&(n<=7&&!small||last))g+=`<text x="${x+bw/2}" y="${H-B-h-7}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${o.fmt?o.fmt(it.v):n0(it.v)}</text>`});
  if(!items.some(i=>i.v))g+=`<text x="${W/2}" y="${H/2}" text-anchor="middle">No entries in this period yet</text>`;

V.nutrition=()=>{const d=ndate||today(),p=P(),mc=macroOn(d),pt=protT(),ct=Math.round(p.kcal*.5/4),ft=Math.round(p.kcal*.28/9);

 const ms=mealsOn(d);

 <section class="card c5"><div class="ch"><h2>Daily summary</h2><span class="src">Food log</span></div>
  <div class="row" style="gap:18px;flex-wrap:nowrap">${ringSvg([{v:mc.k/p.kcal,c:'var(--orange)'}]).replace('max-width:230px','max-width:150px')}<div><div class="big">${n0(mc.k)}</div><p class="k">of ${n0(p.kcal)} kcal · ${n0(Math.max(0,p.kcal-mc.k))} left</p></div></div>
  <div class="col" style="margin-top:12px">${[['Protein',mc.p,pt,'var(--blue)'],['Carbs',mc.c,ct,'var(--orange)'],['Fat',mc.f,ft,'var(--peri)']].map(([l,v,t,c])=>`<div><div class="row between"><span>${l}</span><span class="k">${n0(v)} / ${t} g</span></div><div class="bar" style="--c:${c};margin-top:6px"><i style="width:${clamp(v/t*100,0,100)}%"></i></div></div>`).join('')}</div>
  <p class="note" style="margin-top:12px">Targets: protein ${pt} g (1.2 g per kg), carbs 50% and fat 28% of calories. Adjust calories in Account.</p></section>
 <section class="card c7"><div class="ch"><h2>Add food</h2><div class="seg">${Object.entries(MEALN).map(([k,l])=>`<button class="${mealSel===k?'on':''}" data-act="mealSel" data-m="${k}">${l}</button>`).join('')}</div></div>

  <div id="fres" style="margin-top:6px">${foodRes()}</div>
  <details style="margin-top:10px"><summary class="k" style="cursor:pointer">Add a custom food</summary><form data-form="customFood" class="col" style="margin-top:10px"><div class="fg"><label class="f">Name<input name="n" required maxlength="60"></label><label class="f">Calories<input name="k" type="number" min="0" max="5000" required></label><label class="f">Protein g<input name="p" type="number" min="0" max="500" step="0.1" value="0"></label><label class="f">Carbs g<input name="c" type="number" min="0" max="500" step="0.1" value="0"></label><label class="f">Fat g<input name="fa" type="number" min="0" max="500" step="0.1" value="0"></label></div><button class="btn" style="justify-self:start">Add to ${MEALN[mealSel]}</button></form></details>
  <p class="note" style="margin-top:10px">Built-in values are typical per-serving estimates. Barcode scanning and photo recognition need Open Food Facts, Nutritionix or Edamam keys (see Integrations).</p></section>
 <section class="card c7"><div class="ch"><h2>Meals</h2><span class="s">${ms.length} items</span></div>${Object.entries(MEALN).map(([k,l])=>{const xs=ms.filter(m=>m.m===k);return`<div style="margin-bottom:10px"><div class="row between"><h3>${l}</h3><span class="k">${n0(sum(xs.map(m=>m.k*m.q)))} kcal</span></div>${xs.length?`<div class="list">${xs.map(m=>`<div class="li"><div class="t"><b>${esc(m.n)}${m.q!==1?` × ${m.q}`:''}</b><span>${esc(m.sv||'')} · P ${n0(m.p*m.q)} · C ${n0(m.c*m.q)} · F ${n0(m.fa*m.q)}</span></div><span class="k" style="white-space:nowrap">${n0(m.k*m.q)} kcal</span><button class="x" data-act="del" data-c="meals" data-id="${m.id}" aria-label="Remove ${esc(m.n)}">${ic('trash')}</button></div>`).join('')}</div>`:`<p class="note" style="padding:6px 0">Nothing logged</p>`}</div>`}).join('')}</section>
 <section class="card c5"><div class="ch"><h2>Last 7 days</h2><span class="s">Calories eaten</span></div><div class="fig" id="kc"><svg role="img" aria-label="Calories eaten per day"></svg></div></section>
 <section class="card c5"><div class="ch"><h2>Grocery list</h2><span class="s">${S.grocery.filter(g=>!g.ok).length} to buy</span></div>
  <form data-form="grocery" class="row" style="flex-wrap:nowrap;margin-bottom:6px"><input name="x" required maxlength="60" placeholder="Add an item" aria-label="Grocery item"><button class="btn icon" aria-label="Add item">${ic('plus')}</button></form>
  ${S.grocery.length?`<div class="list">${S.grocery.map(g=>`<div class="li"><input type="checkbox" data-act="gtoggle" data-id="${g.id}" ${g.ok?'checked':''} aria-label="${esc(g.x)}"><div class="t" style="${g.ok?'text-decoration:line-through;color:var(--muted)':''}">${esc(g.x)}</div><button class="x" data-act="del" data-c="grocery" data-id="${g.id}" aria-label="Remove">${ic('trash')}</button></div>`).join('')}</div>`:empty('cart','List is empty','Add what you need for the week.')}</section>
 </div>`};
const foodRes=()=>{const q=fq.trim().toLowerCase();const xs=(q?FOODS.filter(f=>f.n.toLowerCase().includes(q)):FOODS.slice(0,6)).slice(0,8);
 return xs.length?`<div class="list">${xs.map(f=>`<div class="li"><div class="t"><b>${f.n}</b><span>${f.sv} · ${f.k} kcal · P ${f.p} C ${f.c} F ${f.fa}</span></div><select data-q="${f.id}" aria-label="Servings" style="width:80px;min-height:38px;padding:4px 8px">${[.5,1,1.5,2,3].map(v=>`<option value="${v}" ${v===1?'selected':''}>${v}×</option>`).join('')}</select><button class="btn sm" data-act="addFood" data-id="${f.id}">Add</button></div>`).join('')}</div>`:empty('food','No match in the food list','Add it as a custom food below.')};

/* hydration */
V.hydration=()=>{const d=today(),p=P(),w=waterOn(d),pc=clamp(w/p.water,0,1),logs=S.water.filter(x=>x.d===d).sort((a,b)=>b.ts-a.ts);
 barChart('wc',lastN(7).map(x=>({l:dow(x),v:waterOn(x)})),{goal:p.water,color:'var(--water)'});
 const fillY=200-160*pc;
 return demoBanner()+head('Hydration',`Goal ${n0(p.water)} ml a day · ${streak(x=>waterOn(x)>=p.water)}-day streak`)+`<div class="grid">
 <section class="card c5"><div class="row" style="flex-wrap:nowrap;gap:16px"><svg class="glass" viewBox="0 0 160 220" style="max-width:160px" role="img" aria-label="${Math.round(pc*100)} percent of goal"><defs><clipPath id="gl"><path d="M24 20h112l-12 186a10 10 0 0 1-10 9H46a10 10 0 0 1-10-9z"/></clipPath><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62B3F0"/><stop offset="1" stop-color="#1E6091"/></linearGradient></defs><g clip-path="url(#gl)"><rect x="0" y="0" width="160" height="220" fill="var(--surf2)"/><path d="M0 ${fillY} q20 -8 40 0 t40 0 t40 0 t40 0 V220 H0z" fill="url(#wg)" style="transition:d .6s"/><rect x="40" y="30" width="10" height="150" rx="5" fill="#fff" opacity=".25"/></g><path d="M24 20h112l-12 186a10 10 0 0 1-10 9H46a10 10 0 0 1-10-9z" fill="none" stroke="var(--line)" stroke-width="3"/></svg>
  <div><div class="big">${n0(w)}<small>ml</small></div><p class="k">${Math.round(pc*100)}% of goal · ${w>=p.water?'goal reached':n0(p.water-w)+' ml to go'}</p></div></div>
  <div class="row" style="margin-top:16px">${S.glasses.map(g=>`<button class="btn ${g===250?'':'ghost'}" data-act="water" data-ml="${g}">${ic('plus')}${g} ml</button>`).join('')}<button class="btn icon line" data-act="undoWater" aria-label="Undo last" ${logs.length?'':'disabled'}>${ic('undo')}</button></div>
  <form data-form="glass" class="row" style="margin-top:12px;flex-wrap:nowrap"><input name="ml" type="number" min="50" max="2000" step="10" required placeholder="Custom glass size (ml)" aria-label="Custom glass size in ml"><button class="btn line">Save size</button></form></section>
 <section class="card c7"><div class="ch"><h2>This week</h2><span class="s">${lastN(7).filter(x=>waterOn(x)>=p.water).length} of 7 days on goal</span></div><div class="fig" id="wc" style="height:250px"><svg role="img" aria-label="Water per day"></svg></div></section>
 <section class="card c6"><div class="ch"><h2>Today’s log</h2></div>${logs.length?`<div class="list">${logs.map(x=>`<div class="li"><span class="ib" style="--c:var(--water)">${ic('drop')}</span><div class="t"><b>${x.ml} ml</b><span>${fmtT(x.ts)}</span></div><button class="x" data-act="del" data-c="water" data-id="${x.id}" aria-label="Delete">${ic('trash')}</button></div>`).join('')}</div>`:empty('drop','No water yet today','Tap a glass size to log it.')}</section>
 <section class="card c6"><div class="ch"><h2>Reminders</h2><span class="src">In-app</span></div>${remForm()}<p class="note" style="margin-top:10px">Reminders show while Vitalora is open. Phone push and email need Firebase Cloud Messaging and Resend keys.</p>
  <h3 style="margin-top:16px">Saved glass sizes</h3><div class="chips" style="margin-top:8px">${S.glasses.map(g=>`<span class="pill">${g} ml <button class="x" style="width:22px;height:22px" data-act="delGlass" data-ml="${g}" aria-label="Remove ${g} ml">${ic('x')}</button></span>`).join('')}</div></section></div>`};
const remForm=()=>`<form data-form="rem" class="col"><label class="row" style="gap:10px"><input type="checkbox" name="on" ${S.rem.on?'checked':''}> <span>Turn on reminders</span></label><div class="fg"><label class="f">Water every<select name="water">${[1,1.5,2,3].map(v=>`<option value="${v}" ${S.rem.water==v?'selected':''}>${v} h</option>`).join('')}</select></label><label class="f">Bedtime reminder<input type="time" name="bed" value="${S.rem.bed}"></label></div><button class="btn line" style="justify-self:start">Save reminders</button></form>`;

/* sleep */
let noise=null;
V.sleep=()=>{const p=P(),d7=lastN(7),ss=d7.map(sleepOn).filter(Boolean),h7=ss.map(s=>hrs(s.bed,s.wake));
 barChart('sc',lastN(14).map(x=>{const s=sleepOn(x);return{l:dow(x),s:String(dOf(x).getDate()),v:s?Math.round(hrs(s.bed,s.wake)*10)/10:0}}),{goal:p.sleep,color:'var(--peri)',fmt:n1});
 const bedMins=ss.map(s=>{const [h,m]=s.bed.split(':').map(Number);return (h<12?h+24:h)*60+m});const sd=bedMins.length>1?Math.sqrt(avg(bedMins.map(m=>(m-avg(bedMins))**2))):null;
 const hist=[...S.sleep].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,10);
 return demoBanner()+head('Sleep',`Goal ${p.sleep} h a night`)+`<div class="grid">
 <section class="card c4"><div class="ch"><h2>This week</h2><span class="src">Manual</span></div>${ss.length?`<div class="big">${n1(avg(h7))}<small>h avg</small></div><p class="k">${ss.length} nights logged · quality ${n1(avg(ss.map(s=>s.q)))}/5</p><div class="col" style="margin-top:14px"><div class="row between"><span>Bedtime consistency</span><b>${sd===null?'–':sd<30?'Steady':sd<60?'Varies':'Irregular'}</b></div><p class="note">${sd===null?'Log two or more nights.':`Bedtime varies by about ${Math.round(sd)} minutes.`}</p></div>`:empty('moon','No nights logged this week','Use the form to add last night.')}
  <p class="note" style="margin-top:12px">Sleep stages are shown only from a connected sleep tracker. None is connected.</p></section>
 <section class="card c8"><div class="ch"><h2>Last 14 nights</h2><span class="s">Hours asleep</span></div><div class="fig" id="sc" style="height:250px"><svg role="img" aria-label="Hours of sleep per night"></svg></div></section>
 <section class="card c6"><div class="ch"><h2>Log a night</h2></div><form data-form="sleep" class="col"><div class="fg"><label class="f">Woke up on<input type="date" name="d" value="${today()}" max="${today()}" required></label><label class="f">Bedtime<input type="time" name="bed" value="23:00" required></label><label class="f">Wake time<input type="time" name="wake" value="07:00" required></label></div>
  <fieldset style="border:0;padding:0;margin:0"><legend class="k" style="margin-bottom:6px">Quality</legend><div class="seg" role="radiogroup">${[1,2,3,4,5].map(q=>`<label style="display:inline-flex"><input type="radio" name="q" value="${q}" ${q===3?'checked':''} style="position:absolute;opacity:0;width:1px;height:1px"><span class="chip qlab" style="display:grid;place-items:center">${q} ${['Poor','Fair','OK','Good','Great'][q-1]}</span></label>`).join('')}</div></fieldset>
  <label class="f">Sleep journal<textarea name="note" maxlength="500" placeholder="Dreams, wake-ups, caffeine, late meal…"></textarea></label><button class="btn" style="justify-self:start">Save night</button></form></section>

  <div class="row" style="margin-top:12px"><label class="f" style="flex:1">Stop after<select id="noiseT">${[15,30,60,0].map(m=>`<option value="${m}">${m?m+' min':'Keep playing'}</option>`).join('')}</select></label><button class="btn line" data-act="noiseStop" style="align-self:end">Stop</button></div>
  <h3 style="margin-top:18px">Tips that help most people</h3><ul class="note" style="padding-left:18px;display:grid;gap:4px;margin:8px 0 0"><li>Keep the same wake time every day, weekends too.</li><li>Get daylight within an hour of waking.</li><li>Stop caffeine about 8 hours before bed.</li><li>Keep the bedroom cool, dark and quiet.</li><li>If awake for 20+ minutes, get up and do something calm until sleepy.</li></ul></section>
 <section class="card c12"><div class="ch"><h2>History</h2></div>${hist.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Night</th><th>Bed</th><th>Wake</th><th style="text-align:right">Hours</th><th style="text-align:right">Quality</th><th>Note</th><th></th></tr></thead><tbody>${hist.map(s=>`<tr><td>${fmtD(s.d)}</td><td>${s.bed}</td><td>${s.wake}</td><td class="n">${n1(hrs(s.bed,s.wake))}</td><td class="n">${s.q}/5</td><td>${esc(s.note)}</td><td><button class="x" data-act="del" data-c="sleep" data-id="${s.id}" aria-label="Delete">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div>`:empty('moon','No sleep history','Your nights will appear here.')}</section></div>`};

/* mind */
let jk='journal',moodPick=null,moodTags=[];
const crisisCard=()=>`<div class="crisis"><b>Need to talk to someone now?</b> In India, call Tele-MANAS <b>14416</b> or 1-800-891-4416 (free, 24×7, many languages). In an emergency call <b>112</b>. Outside India, contact your local emergency number. Vitalora is not a substitute for professional care.</div>`;

 return demoBanner()+head('Mood & journal','Check in, notice patterns, write it down.')+`<div class="grid">

 <section class="card c5 col" style="align-content:start"><div class="card tint" style="background:var(--navy);color:#fff"><p class="k" style="color:#B9C8DA">Affirmation for today</p><p class="mid" style="color:#fff;margin-top:8px;line-height:1.25">${aff}</p></div>${crisisCard()}</section>
 <section class="card c6"><div class="ch"><h2>Mood calendar</h2><span class="s">Last 5 weeks</span></div><div class="cal">${cells.slice(0,7).map(x=>`<div class="h">${dow(x).slice(0,2)}</div>`).join('')}${cells.map(x=>{const m=moodOn(x);return`<div style="${m?`background:${MOODC[m.m-1]};color:#fff`:''}" title="${fmtD(x)}${m?': '+MOODS[m.m-1]:''}">${dOf(x).getDate()}</div>`}).join('')}</div>
  <div class="row" style="margin-top:10px;gap:12px">${MOODS.map((m,i)=>`<span class="row note" style="gap:5px"><span class="dot" style="--c:${MOODC[i]}"></span>${m}</span>`).join('')}</div></section>
 <section class="card c6"><div class="ch"><h2>Journal</h2><div class="seg"><button class="${jk==='journal'?'on':''}" data-act="jk" data-k="journal">Emotional</button><button class="${jk==='gratitude'?'on':''}" data-act="jk" data-k="gratitude">Gratitude</button></div></div>

  <div class="list" style="margin-top:8px">${js.length?js.slice(0,6).map(j=>`<div class="li"><div class="t"><span>${new Date(j.ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'})} · ${fmtT(j.ts)}</span><p style="white-space:pre-wrap">${esc(j.x)}</p></div><button class="x" data-act="del" data-c="journal" data-id="${j.id}" aria-label="Delete entry">${ic('trash')}</button></div>`).join(''):'<p class="note">No entries yet. Entries stay private to your account.</p>'}</div></section>
 <section class="card c12"><div class="ch"><h2>Well-being check (WHO-5)</h2>${w5?`<span class="pill ${w5.s>50?'m':'o'}">Last: ${w5.s}/100 on ${fmtD(w5.d)}</span>`:''}</div><p class="k" style="margin-bottom:12px">Over the last two weeks… A short, widely used self-check of well-being. It is not a diagnosis.</p>
  <form data-form="who5" class="col">${WHO5.map((q,i)=>`<label class="f"><span style="color:var(--ink)">${i+1}. ${q}</span><select name="q${i}" required><option value="">Choose</option>${WHO5A.map((a,j)=>`<option value="${5-j}">${a}</option>`).reverse().join('')}</select></label>`).join('')}<button class="btn" style="justify-self:start">See my score</button></form></section></div>`};

/* meditate */
let br={on:false,pat:'box',i:0,t:0,end:0},medSel='arrive',medRun=null;
V.meditate=()=>{const ms=streak(x=>medOn(x)>0),tot=sum(S.med.map(m=>m.min)),b=BREATH.find(x=>x.id===br.pat),m=MEDS.find(x=>x.id===medSel);
 barChart('mc',lastN(7).map(x=>({l:dow(x),v:medOn(x)})),{color:'var(--mintd)'});
 return demoBanner()+head('Meditate & breathe',`${ms}-day streak · ${n0(tot)} mindful minutes in total`)+`<div class="grid">
 <section class="card c7"><div class="ch"><h2>Guided breathing</h2><div class="seg">${BREATH.map(x=>`<button class="${br.pat===x.id?'on':''}" data-act="brPat" data-p="${x.id}">${x.n}</button>`).join('')}</div></div>

 <section class="card c5"><div class="ch"><h2>Mindful minutes</h2><span class="s">Last 7 days</span></div><div class="fig" id="mc" style="height:200px"><svg role="img" aria-label="Meditation minutes per day"></svg></div>
  <form data-form="medLog" class="row" style="margin-top:10px;flex-wrap:nowrap"><input name="min" type="number" min="1" max="240" required placeholder="Minutes practised elsewhere" aria-label="Minutes"><button class="btn line">Log</button></form></section>
 <section class="card c5"><div class="ch"><h2>Library</h2><span class="s">${MEDS.length} sessions</span></div><div class="list">${MEDS.map(x=>`<div class="li"><span class="ib" style="--c:${x.lvl==='Sleep'?'var(--peri)':'var(--mintd)'}">${ic(x.lvl==='Sleep'?'moon':'wind')}</span><div class="t"><b>${x.n}</b><span>${x.min} min · ${x.lvl}</span></div><button class="btn sm ${medSel===x.id?'':'ghost'}" data-act="medSel" data-id="${x.id}">${medSel===x.id?'Selected':'Choose'}</button></div>`).join('')}</div></section>

/* ---------- audio ---------- */
let AC=null;const ac=()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC};
function bell(){const a=ac();if(!a)return;[528,792].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(i?.05:.18,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+3.5);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+3.6)})}
function startNoise(n){stopNoise();const a=ac();if(!a){toast('Audio is not available in this browser.');return}
 const len=a.sampleRate*4,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);let b0=0,b1=0,b2=0,last=0;
 for(let i=0;i<len;i++){const w=Math.random()*2-1;if(n==='Brown noise'||n==='Ocean'){last=(last+.02*w)/1.02;d[i]=last*3.5}else{b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.11}}
 const src=a.createBufferSource();src.buffer=buf;src.loop=true;const g=a.createGain();g.gain.value=n==='Rain'?.5:.6;let node=src;
 if(n==='Rain'){const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=900;src.connect(f);node=f}
 if(n==='Ocean'){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=.09;lg.gain.value=.35;l.connect(lg).connect(g.gain);l.start();noise={l}}
 node.connect(g).connect(a.destination);src.start();const mins=+(document.getElementById('noiseT')||{}).value||0;
 noise=Object.assign(noise||{},{n,src,g,end:mins?Date.now()+mins*60000:0});}
function stopNoise(){if(noise){try{noise.src.stop();noise.l&&noise.l.stop()}catch(e){}noise=null}}

/* ---------- timers ---------- */
function tickTimers(){
 const a=document.getElementById('wtime');if(a)a.textContent=mmss(wt.acc+(wt.run?Date.now()-wt.start:0));
 const r=document.getElementById('rtime');if(r){const left=Math.max(0,rest.end-Date.now());r.textContent=`${Math.floor(left/60000)}:${pad(Math.floor(left/1000)%60)}`;const l=document.getElementById('restLbl');if(l)l.textContent=rest.end&&left>0?'Resting':'Ready'}
 const m=document.getElementById('medT');if(m&&medRun){const left=Math.max(0,medRun.end-Date.now());m.textContent=mmss(left)}
}
setInterval(()=>{tickTimers();
 if(rest.end&&Date.now()>=rest.end){rest.end=0;bell();toast('Rest is over. Next set!')}
 if(medRun&&Date.now()>=medRun.end){finishMed(true)}
 if(noise&&noise.end&&Date.now()>=noise.end){stopNoise();if(route()==='sleep')render()}
},250);
function finishMed(full){const m=MEDS.find(x=>x.id===medRun.id);const mins=full?m.min:Math.max(1,Math.round((Date.now()-medRun.start)/60000));if(tts){try{tts.stop()}catch(e){}}bell();
 if(full||Date.now()-medRun.start>45000){S.med.push({id:uid(),d:today(),ts:Date.now(),min:mins,k:m.n});save();toast(`${mins} mindful minutes saved.`)}medRun=null;render()}
let brT=0;
function brStep(){const b=BREATH.find(x=>x.id===br.pat);if(!br.on)return;if(Date.now()>=br.end){br.on=false;S.med.push({id:uid(),d:today(),ts:Date.now(),min:Math.max(1,Math.round(br.len)),k:'Breathing'});save();bell();toast('Breathing session saved.');render();return}
 const [lab,sec]=b.ph[br.i%b.ph.length];const orb=document.getElementById('orb'),bl=document.getElementById('blabel');
 if(orb){orb.style.transitionDuration=sec+'s';orb.style.transform=lab==='Breathe in'?'scale(1)':lab==='Breathe out'?'scale(.55)':orb.style.transform||'scale(.55)'}
 let c=Math.ceil(sec);const upd=()=>{const el=document.getElementById('blabel');if(el)el.innerHTML=`${lab}<small>${c}</small>`};upd();
 clearInterval(br.ci);br.ci=setInterval(()=>{c--;if(c>0)upd()},1000);
 br.i++;brT=setTimeout(brStep,sec*1000)}

const failed=new Set();
async function API(method,path,body,retry=true){
 const isForm=body instanceof FormData;
 const r=await fetch('/api'+path,{method,credentials:'same-origin',headers:{'X-Requested-With':'vitalora',...(body&&!isForm?{'Content-Type':'application/json'}:{})},body:isForm?body:body!==undefined?JSON.stringify(body):undefined});
 if(r.status===401&&retry&&!/^\/auth\/(login|register|refresh|logout|password|otp)/.test(path)){const rf=await fetch('/api/auth/refresh',{method:'POST',credentials:'same-origin',headers:{'X-Requested-With':'vitalora','Content-Type':'application/json'},body:'{}'});if(rf.ok)return API(method,path,body,false);srvUser=null;render();throw{status:401,message:'Please sign in again.'}}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}
 if(!r.ok){const er=(j&&j.error)||{};throw{status:r.status,code:er.code,message:er.message||'Request failed',details:er.details}}
 return j}
const iso=ts=>new Date(ts).toISOString();
const atDay=d=>d===today()?new Date().toISOString():new Date(d+'T12:00:00').toISOString();

const MK2S={weight:'WEIGHT',rhr:'RESTING_HEART_RATE',hr:'HEART_RATE',bp:'BLOOD_PRESSURE',spo2:'SPO2',temp:'BODY_TEMPERATURE',glucose:'BLOOD_GLUCOSE',waist:'WAIST',fat:'BODY_FAT'};
const S2MK=Object.fromEntries(Object.entries(MK2S).map(([a,b])=>[b,a]));
const SEX2S={f:'FEMALE',m:'MALE',x:'UNSPECIFIED'},S2SEX={FEMALE:'f',MALE:'m',UNSPECIFIED:'x'};
const COLS={
 water:{p:'/water',body:x=>({amountMl:x.ml,loggedAt:iso(x.ts)})},
 meals:{p:'/nutrition',body:x=>({meal:x.m.toUpperCase(),quantity:x.q,eatenAt:atDay(x.d),manual:{name:String(x.n).slice(0,80),serving:String(x.sv||'1 serving').slice(0,40),calories:+x.k||0,protein:+x.p||0,carbs:+x.c||0,fat:+x.fa||0}})},
 workouts:{p:'/workouts',body:x=>({type:x.t.toUpperCase(),durationMin:+x.min,...(x.km!==''&&x.km!=null?{distanceKm:+x.km}:{}),intensity:x.it.toUpperCase(),startedAt:atDay(x.d)})},
 sleep:{p:'/sleep',body:x=>({wakeDate:x.d,bedtime:x.bed,wakeTime:x.wake,quality:x.q,...(x.note?{note:x.note}:{})}),patch:true},
 moods:{p:'/moods',body:x=>({mood:x.m,stress:x.st,tags:x.tags||[],...(x.note?{note:x.note}:{}),loggedAt:iso(x.ts)})},
 journal:{p:'/journal',body:x=>({kind:x.k==='gratitude'?'GRATITUDE':'EMOTIONAL',body:x.x})},
 metrics:{p:'/metrics',body:x=>({kind:MK2S[x.k],value:+x.v,...(x.k==='bp'?{value2:+x.v2}:{}),measuredAt:iso(x.ts)})},
 med:{p:'/meditation/sessions',body:x=>({minutes:+x.min,kind:x.k==='Breathing'?'breathing':x.k==='Logged'?'logged':'guided',completedAt:iso(x.ts)})},
 grocery:{p:'/grocery',body:x=>({text:x.x}),patchBody:x=>({done:!!x.ok}),patch:true},

async function syncNow(){
 if(!srvUser||!srvSnap)return;if(syncing){syncAgain=true;return}syncing=true;let err=null;
 const run=async(key,fn)=>{if(failed.has(key))return;try{await fn()}catch(e){if(e.status===401)throw e;if(e.status>=400&&e.status<500)failed.add(key);err=e}};
 try{
  for(const [k,cfg] of Object.entries(COLS)){const prev=srvSnap.c[k]||{};const now=new Set();
   for(const x of S[k]){if(x.dev)continue;
    if(!x.sid){await run(k+':'+x.id,async()=>{const r=await API('POST',cfg.p,cfg.body(x));x.sid=r.id;prev[x.sid]=JSON.stringify(x)})}
    else if(cfg.patch&&prev[x.sid]!==undefined&&prev[x.sid]!==JSON.stringify(x)){await run(k+':p:'+x.sid+JSON.stringify(x),async()=>{await API('PATCH',cfg.p+'/'+x.sid,(cfg.patchBody||cfg.body)(x));prev[x.sid]=JSON.stringify(x)})}
    if(x.sid)now.add(x.sid)}
   for(const sid of Object.keys(prev))if(!now.has(sid))await run(k+':d:'+sid,async()=>{cfg.del?await cfg.del(sid):await API('DELETE',cfg.p+'/'+sid);delete prev[sid]});
   srvSnap.c[k]=prev}
  for(const [d,n] of Object.entries(S.steps))if(srvSnap.steps[d]!==n)await run('st:'+d+n,async()=>{await API('POST','/activity',{date:d,steps:Math.max(0,Math.round(+n||0)),mode:'set'});srvSnap.steps[d]=n});
  const curH=new Set();
  for(const h of S.habits){if(!h.sid)await run('h:'+h.id,async()=>{const r=await API('POST','/habits',{name:String(h.n).slice(0,60),category:['Fitness','Nutrition','Sleep','Mind','Hydration','Productivity','Other'].includes(h.cat)?h.cat:'Other'});h.sid=r.id;srvSnap.habits[h.sid]=1;srvSnap.hdone[h.sid]=[]});
   if(!h.sid)continue;curH.add(h.sid);const was=new Set(srvSnap.hdone[h.sid]||[]),is=new Set(S.hdone[h.id]||[]);
   for(const d of is)if(!was.has(d))await run('hd:'+h.sid+d,async()=>{await API('POST','/habits/'+h.sid+'/toggle',{date:d,done:true});was.add(d)});
   for(const d of was)if(!is.has(d))await run('hu:'+h.sid+d,async()=>{await API('POST','/habits/'+h.sid+'/toggle',{date:d,done:false});was.delete(d)});
   srvSnap.hdone[h.sid]=[...was]}
  for(const sid of Object.keys(srvSnap.habits))if(!curH.has(sid))await run('hdel:'+sid,async()=>{await API('DELETE','/habits/'+sid);delete srvSnap.habits[sid]});
  const pl=JSON.stringify(S.plan);if(pl!==srvSnap.plan){const old=JSON.parse(srvSnap.plan||'{}');
   for(let i=0;i<7;i++){const a=S.plan[i],b=old[i];if(JSON.stringify(a)===JSON.stringify(b))continue;await run('pl:'+i+JSON.stringify(a),async()=>{a?await API('PUT','/workout-plans',{weekday:i,type:a.t.toUpperCase(),minutes:+a.min}):await API('DELETE','/workout-plans?weekday='+i)})}
   srvSnap.plan=pl}
  const pb=JSON.stringify(profBody());if(pb!==srvSnap.prof&&S.onboarded)await run('prof:'+pb,async()=>{await API('PATCH','/me/profile',JSON.parse(pb));srvSnap.prof=pb});
  for(const w of S.who5)if(!w.sid&&w.a)await run('w5:'+w.d+w.s,async()=>{const r=await API('POST','/assessments',{instrument:'WHO5',answers:w.a});w.sid=r.id});
 }catch(e){err=e}
 syncing=false;sync=err?'error':'cloud';updSync();savePending();
 try{localStorage.setItem('vitalora.srv.cache',JSON.stringify({u:srvUser&&srvUser.id,at:Date.now()}))}catch(e){}
 if(err&&err.status!==401&&!syncAgain)toast(err.code==='upgrade_required'?err.message:'Some changes could not be saved: '+(err.message||'network error'));
 if(syncAgain){syncAgain=false;syncNow()}}
async function pull(){
 const from=addD(today(),-120),q=`?from=${from}&limit=200`;
 const g=p=>API('GET',p).catch(()=>({items:[]}));
 const [prof,water,act,wo,plans,meals,groc,sl,mo,jr,me2,hb,md,ap,w5]=await Promise.all([API('GET','/me/profile'),g('/water'+q),g('/activity?from='+from),g('/workouts'+q),g('/workout-plans'),g('/nutrition'+q),g('/grocery?limit=200'),g('/sleep'+q),g('/moods'+q),g('/journal'+q),g('/metrics'+q),g('/habits'),g('/meditation/sessions'+q),g('/appointments'),g('/assessments')]);
 const theme=S&&S.profile?S.profile.theme:'system';const n=DEF();n.profile.theme=theme;n.onboarded=!!prof.onboardedAt;n.consent=true;
 Object.assign(n.profile,{name:prof.name||'',age:prof.birthYear?new Date().getFullYear()-prof.birthYear:30,sex:S2SEX[prof.sex]||'x',height:prof.heightCm||165,weight:prof.weightKg||65,activity:String(prof.activityLevel||'MODERATE').toLowerCase(),goals:prof.goals||[],water:prof.waterGoalMl,kcal:prof.calorieGoal,steps:prof.stepGoal,sleep:prof.sleepGoalH,lang:prof.language||'en'});
 n.glasses=prof.glassSizesMl&&prof.glassSizesMl.length?prof.glassSizesMl:n.glasses;
 const np=prof.notifyPrefs||{};n.rem={on:!!(np.water&&np.water.on),water:(np.water&&np.water.everyH)||2,bed:np.bedtime||'22:30'};
 const dk=t=>dkey(new Date(t));
 n.water=water.items.map(x=>({id:uid(),sid:x.id,d:dk(x.loggedAt),ts:+new Date(x.loggedAt),ml:x.amountMl}));
 n.steps={};n.dsteps={};for(const a of act.items){if(a.source==='MANUAL')n.steps[a.date]=a.steps;else n.dsteps[a.date]=Math.max(n.dsteps[a.date]||0,a.steps)}
 n.workouts=wo.items.map(x=>({id:uid(),sid:x.id,d:dk(x.startedAt),t:x.type.toLowerCase(),min:x.durationMin,km:x.distanceKm??'',it:x.intensity.toLowerCase(),k:x.calories}));
 n.plan={};for(const p of plans.items)n.plan[p.weekday]={t:p.type.toLowerCase(),min:p.minutes};
 n.meals=meals.items.map(x=>{const qn=x.quantity||1;return{id:uid(),sid:x.id,d:dk(x.eatenAt),m:x.meal.toLowerCase(),n:x.name,sv:x.serving,q:qn,k:x.calories/qn,p:x.protein/qn,c:x.carbs/qn,fa:x.fat/qn}});
 n.grocery=groc.items.map(x=>({id:uid(),sid:x.id,x:x.text,ok:x.done}));
 n.sleep=sl.items.map(x=>({id:uid(),sid:x.id,d:x.wakeDate,bed:hm(x.bedtime),wake:hm(x.wakeTime),q:x.quality,note:x.note||'',...(x.source!=='MANUAL'?{dev:1}:{})}));
 n.moods=mo.items.map(x=>({id:uid(),sid:x.id,d:dk(x.loggedAt),ts:+new Date(x.loggedAt),m:x.mood,st:x.stress,tags:x.tags||[],note:x.note||''}));
 n.journal=jr.items.map(x=>({id:uid(),sid:x.id,ts:+new Date(x.createdAt),k:x.kind==='GRATITUDE'?'gratitude':'journal',x:x.body||''}));
 n.metrics=me2.items.filter(x=>S2MK[x.kind]).map(x=>({id:uid(),sid:x.id,d:dk(x.measuredAt),ts:+new Date(x.measuredAt),k:S2MK[x.kind],v:x.value,...(x.value2!=null?{v2:x.value2}:{}),src:x.source==='MANUAL'?'manual':'device',...(x.source!=='MANUAL'?{dev:1}:{})}));
 n.med=md.items.map(x=>({id:uid(),sid:x.id,d:dk(x.completedAt),ts:+new Date(x.completedAt),min:x.minutes,k:x.kind==='breathing'?'Breathing':x.kind==='logged'?'Logged':'Guided'}));
 n.appts=ap.items.filter(x=>x.status!=='CANCELLED').map(x=>({id:uid(),sid:x.id,who:x.with||x.externalName||'Appointment',at:+new Date(x.startsAt),note:x.notes||'',...(x.professionalId?{dev:1}:{})}));
 n.habits=hb.items.map(x=>({id:uid(),sid:x.id,n:x.name,cat:x.category,cr:dk(x.createdAt)}));for(const h of n.habits){const src=hb.items.find(x=>x.id===h.sid);n.hdone[h.id]=src.last28.filter(z=>z.done).map(z=>z.date)}
 n.who5=w5.items.filter(x=>x.instrument==='WHO5').reverse().map(x=>({sid:x.id,d:dk(x.createdAt),s:x.score}));
 S=n;takeSnap();restorePending();sync='cloud';updSync()}
async function srvBoot(){sync='wait';updSync();
 try{srvUser=await API('GET','/auth/me');await pull()}catch(e){srvUser=null;if(!S)S=DEF()}

async function afterAuth(){srvUser=await API('GET','/auth/me');await pull();authErr='';authInfo='';location.hash='today';render();if(!S.onboarded)openSetup()}
function authView(){const t=(m,l)=>`<button class="${authMode===m?'on':''}" data-act="authMode" data-m="${m}">${l}</button>`;

 const body={login:`<form data-form="login" class="col"><label class="f">Email<input name="email" type="email" required autocomplete="email"></label><label class="f">Password<input name="password" type="password" required autocomplete="current-password"></label>${err}${btn('Sign in')}<button type="button" class="btn ghost sm" data-act="authMode" data-m="forgot" style="justify-self:start">Forgot password?</button></form>`,
  register:`<form data-form="register" class="col"><label class="f">Your name<input name="name" required maxlength="60" autocomplete="name"></label><label class="f">Email<input name="email" type="email" required autocomplete="email"></label><label class="f">Password<input name="password" type="password" required minlength="8" autocomplete="new-password"><span class="note">At least 8 characters with letters and a number.</span></label><label class="row" style="gap:10px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" name="consent" required style="margin-top:3px"><span class="note">I agree to the <a href="/terms" target="_blank">Terms</a> and <a href="/privacy" target="_blank">Privacy Policy</a>, and allow Vitalora to process the health data I log to provide the service.</span></label>${err}${btn('Create account')}</form>`,
  forgot:`<form data-form="forgot" class="col"><label class="f">Email<input name="email" type="email" required></label>${info}${err}${btn('Send reset code')}</form><form data-form="reset" class="col" style="margin-top:14px"><label class="f">6-digit code<input name="code" inputmode="numeric" pattern="\\d{6}" required></label><label class="f">New password<input name="password" type="password" minlength="8" required></label>${btn('Set new password')}</form>`}[authMode];
 return`<div style="max-width:440px;margin:4vh auto 0" class="card col"><div class="row" style="gap:12px"><span class="logo" style="width:52px;height:52px"><img src="${document.querySelector('link[rel=apple-touch-icon]').href}" alt="" width="40" height="40"></span><div><h1 style="font-size:28px">Vitalora</h1><p class="k">Your daily wellness, in one place.</p></div></div><div class="seg">${t('login','Sign in')}${t('register','Create account')}</div>${body}<p class="note">Vitalora supports general wellness and is not a medical device. In an emergency call 112.</p></div>`}
const authRun=async fn=>{authBusy=true;authErr='';render();try{await fn()}catch(e){authErr=e.details&&e.details[0]?e.details[0].message:e.message||'Something went wrong'}authBusy=false;render()};
F.login=fd=>authRun(async()=>{await API('POST','/auth/login',{email:fd.get('email'),password:fd.get('password')});await afterAuth()});
F.register=fd=>authRun(async()=>{await API('POST','/auth/register',{name:fd.get('name'),email:fd.get('email'),password:fd.get('password'),consent:{terms:true,privacy:true,healthData:true},timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,language:'en'});await afterAuth()});
F.forgot=fd=>authRun(async()=>{const r=await API('POST','/auth/password/forgot',{email:fd.get('email')});authInfo=r.message+(r.devCode?` (development code: ${r.devCode})`:'');S._resetEmail=fd.get('email')});
F.reset=fd=>authRun(async()=>{await API('POST','/auth/password/reset',{email:S._resetEmail,code:fd.get('code'),newPassword:fd.get('password')});authMode='login';authInfo='';toast('Password updated. Sign in with the new password.')});
A.authMode=el=>{authMode=el.dataset.m;authErr='';render()};
async function srvCoach(q){if(coachBusy)return;coachErr='';S.chat.push({role:'user',content:q});coachBusy=true;render();
 try{const r=await API('POST','/ai/chat?stream=0',{message:q,language:P().lang,...(srvConv?{conversationId:srvConv}:{})});srvConv=r.conversationId;S.chat.push({role:'assistant',content:r.reply})}
 catch(e){S.chat.pop();coachErr=e.message||'The coach could not answer just now.'}
 coachBusy=false;render();const c2=document.getElementById('chat');c2&&(c2.scrollTop=c2.scrollHeight)}
async function srvAi(){if(aiBusy)return;const v=id=>(document.getElementById(id)||{}).value||'';const q=v('aiQ').trim();
 const map={photo:'/ai/meal-photo',mealplan:'/ai/meal-plan',workout:'/ai/workout-plan',weekly:'/ai/weekly-report',sleepc:'/ai/sleep-coach',stress:'/ai/stress-coach',doctor:'/ai/doctor-summary',lab:'/ai/lab-explainer',reflect:'/ai/journal-reflection'};
 let body={};
 if(aiT==='photo'){if(!aiImg){aiErr='Choose a photo first.';render();return}body=new FormData();body.set('image',aiImg.blob,'meal');body.set('meal',(v('aiMeal')||mealSel).toUpperCase())}
 if(aiT==='mealplan')body={days:+v('aiDays'),diet:v('aiDiet'),calorieTarget:+v('aiKcal'),avoid:v('aiAvoid').split(',').map(x=>x.trim()).filter(Boolean)};
 if(aiT==='workout')body={daysPerWeek:+v('aiWd'),minutesPerSession:+v('aiWm'),level:v('aiLvl'),equipment:v('aiEq').split(',').map(x=>x.trim()).filter(Boolean),...(v('aiLim')?{limitations:v('aiLim')}:{})};
 if(aiT==='sleepc')body=q?{question:q}:{};
 if(aiT==='stress'){if(q.length<3){aiErr='Describe the situation first.';render();return}body={situation:q}}
 if(aiT==='doctor')body={days:30,...(q?{concerns:q}:{})};
 if(aiT==='lab'){if(q.length<10){aiErr='Paste the report text first.';render();return}body={reportText:q}}
 aiBusy=true;aiErr='';aiOut=null;render();
 try{await syncNow();
  if(aiT==='reflect'){const j=S.journal.find(x=>x.id===v('aiEntry'));if(!j||!j.sid)throw{message:'Save the journal entry first.'};body={entryId:j.sid}}
  const r=await API('POST',map[aiT],body);
  aiOut=r.crisis?{kind:aiT,crisis:true,out:''}:{kind:aiT,out:r.output,id:r.id||uid(),ts:Date.now(),meal:v('aiMeal')||mealSel};
  if(!r.crisis){S.aiReports=[...(S.aiReports||[]),{id:aiOut.id,kind:aiT,ts:aiOut.ts,out:r.output}].slice(-12)}}
 catch(e){aiErr=e.code==='upgrade_required'?'AI health tools are part of Premium. Start the free 7-day trial from Plans.':e.code==='not_configured'?'AI is not switched on for this server yet.':e.message||'Something went wrong.'}
 aiBusy=false;render();const o=document.getElementById('aiOut');o&&o.scrollIntoView({behavior:'smooth',block:'nearest'})}
if(SRV){

 A.importOpen=()=>toast('Import is available in the offline version only.');
 A.boardToggle=()=>toast('Turn on the leaderboard in privacy settings.');
 const _obDone=F.obDone;F.obDone=fd=>{_obDone(fd);const p=P();API('POST','/me/onboarding',{name:p.name,birthYear:new Date().getFullYear()-p.age,sex:SEX2S[p.sex]||'UNSPECIFIED',heightCm:+p.height,weightKg:+p.weight,activityLevel:p.activity.toUpperCase(),goals:p.goals,acceptWellnessDisclaimer:true,targets:{calorieGoal:+p.kcal,waterGoalMl:+p.water,stepGoal:+p.steps,sleepGoalH:+p.sleep}}).then(()=>{srvSnap.prof='';schedSync()}).catch(e=>toast(e.message))};
 window.addEventListener('online',()=>schedSync());
}

   if(snap.exists){const rem=snap.data();if(!S||!S.savedAt||(rem.savedAt||0)>S.savedAt){S=Object.assign(DEF(),JSON.parse(JSON.stringify(rem)));persistLocal()}}

   if(S&&S.savedAt&&(!snap.exists||S.savedAt>(snap.data().savedAt||0)))flush();
