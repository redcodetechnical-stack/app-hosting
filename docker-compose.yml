services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vitalora, POSTGRES_PASSWORD: vitalora, POSTGRES_DB: vitalora }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vitalora"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  migrate:
    build: .
    command: ["sh", "-c", "npx tsx src/db/migrate.ts && npx tsx src/db/seed.ts"]
    env_file: .env
    environment: { DATABASE_URL: "postgresql://vitalora:vitalora@db:5432/vitalora" }
    depends_on: { db: { condition: service_healthy } }
  api:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgresql://vitalora:vitalora@db:5432/vitalora", REDIS_URL: "redis://redis:6379" }
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
volumes:
  pgdata:
